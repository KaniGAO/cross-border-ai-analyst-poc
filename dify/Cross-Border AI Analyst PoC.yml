    - data:
        code: "import json\n\ndef main(api_response: str) -> dict:\n    # 解析 API 返回的\
          \ JSON 数据\n    data = json.loads(api_response)\n    orders = data.get(\"\
          orders\", [])\n    date_str = data.get(\"date\", \"\")\n\n    # 若没有订单，返回空汇总\n\
          \    if not orders:\n        return {\n            \"date\": date_str,\n\
          \            \"summary\": {\n                \"total_orders\": 0,\n    \
          \            \"total_profit\": 0,\n                \"overall_profit_margin\"\
          : 0,\n                \"platforms\": {}\n            },\n            \"\
          orders_detail\": [],\n            \"sku_insights\": {}\n        }\n\n  \
          \  # 初始化\n    platform_stats = {}\n    sku_orders = {}\n    enriched_orders\
          \ = []\n\n    for order in orders:\n        sale_price = float(order.get(\"\
          sale_price\", 0))\n        cost_price = float(order.get(\"cost_price\",\
          \ 0))\n        shipping_fee = float(order.get(\"shipping_fee\", 0))\n  \
          \      quantity = int(order.get(\"quantity\", 1))\n        platform = order.get(\"\
          platform\", \"unknown\")\n        sku = order.get(\"sku\", \"unknown\")\n\
          \n        profit = (sale_price - cost_price - shipping_fee) * quantity\n\
          \        revenue = sale_price * quantity\n        margin = profit / revenue\
          \ if revenue != 0 else 0\n\n        if margin > 0:\n            status =\
          \ \"盈利\"\n        elif margin < 0:\n            status = \"亏损\"\n      \
          \  else:\n            status = \"持平\"\n\n        enriched = order.copy()\n\
          \        enriched[\"profit\"] = round(profit, 2)\n        enriched[\"profit_margin\"\
          ] = round(margin * 100, 2)\n        enriched[\"status\"] = status\n    \
          \    enriched_orders.append(enriched)\n\n        # 平台汇总\n        if platform\
          \ not in platform_stats:\n            platform_stats[platform] = {\n   \
          \             \"total_orders\": 0,\n                \"total_profit\": 0,\n\
          \                \"total_revenue\": 0\n            }\n        platform_stats[platform][\"\
          total_orders\"] += 1\n        platform_stats[platform][\"total_profit\"\
          ] += profit\n        platform_stats[platform][\"total_revenue\"] += revenue\n\
          \n        # SKU 统计\n        if sku not in sku_orders:\n            sku_orders[sku]\
          \ = {\"order_count\": 0, \"total_profit\": 0}\n        sku_orders[sku][\"\
          order_count\"] += 1\n        sku_orders[sku][\"total_profit\"] += profit\n\
          \n    # 平台平均利润率\n    for p, stats in platform_stats.items():\n        total_rev\
          \ = stats[\"total_revenue\"]\n        stats[\"avg_profit_margin\"] = round((stats[\"\
          total_profit\"] / total_rev) * 100, 2) if total_rev != 0 else 0\n      \
          \  del stats[\"total_revenue\"]\n\n    # SKU 洞察与模拟周转天数\n    total_orders_all\
          \ = len(orders)\n    avg_ord = total_orders_all / len(sku_orders) if sku_orders\
          \ else 1\n    sku_insights = {}\n    for sku, s_data in sku_orders.items():\n\
          \        cnt = s_data[\"order_count\"]\n        activity = cnt / avg_ord\
          \ if avg_ord > 0 else 1\n        turnover_days = round(30 / (activity +\
          \ 0.5), 1)\n        sku_insights[sku] = {\n            \"order_count\":\
          \ cnt,\n            \"total_profit\": round(s_data[\"total_profit\"], 2),\n\
          \            \"activity_score\": round(activity, 2),\n            \"simulated_turnover_days\"\
          : turnover_days\n        }\n\n    total_profit = sum(s[\"total_profit\"\
          ] for s in platform_stats.values())\n    total_revenue = sum(float(o.get(\"\
          sale_price\",0)) * int(o.get(\"quantity\",1)) for o in orders)\n    overall_margin\
          \ = (total_profit / total_revenue * 100) if total_revenue != 0 else 0\n\n\
          \    summary = {\n        \"total_orders\": len(orders),\n        \"total_profit\"\
          : round(total_profit, 2),\n        \"overall_profit_margin\": round(overall_margin,\
          \ 2),\n        \"platforms\": platform_stats\n    }\n    \n        # ----\
          \ 数字净化，消除浮点尾巴 ----\n    summary[\"total_profit\"] = round(summary[\"total_profit\"\
          ], 2)\n    summary[\"overall_profit_margin\"] = round(summary[\"overall_profit_margin\"\
          ], 2)\n    for p in summary[\"platforms\"]:\n        summary[\"platforms\"\
          ][p][\"total_profit\"] = round(summary[\"platforms\"][p][\"total_profit\"\
          ], 2)\n        summary[\"platforms\"][p][\"avg_profit_margin\"] = round(summary[\"\
          platforms\"][p][\"avg_profit_margin\"], 2)\n    for o in enriched_orders:\n\
          \        o[\"profit\"] = round(o[\"profit\"], 2)\n        o[\"profit_margin\"\
          ] = round(o[\"profit_margin\"], 2)\n    for s in sku_insights:\n       \
          \ sku_insights[s][\"total_profit\"] = round(sku_insights[s][\"total_profit\"\
          ], 2)\n    # ---------------------------------\n\n    return {\n       \
          \ \"calculated_data\":{\n            \"date\": date_str,\n            \"\
          summary\": summary,\n            \"orders_detail\": enriched_orders,\n \
          \           \"sku_insights\": sku_insights\n        }\n    }\n    "
